# pnpm settings. pnpm 10+ reads them here — neither package.json's "pnpm" field nor the
# equivalent .npmrc keys are honoured any more.

# `web/` é membro do workspace, e não um projeto separado com lockfile próprio, por
# causa do `allowBuilds` abaixo: o Vite arrasta o esbuild, e um `web/` autônomo não
# herdaria esta configuração — cairia no mesmo ERR_PNPM_IGNORED_BUILDS descrito ali.
packages:
  - web

# pnpm blocks dependency build scripts by default. esbuild (pulled in by vitest and tsx)
# fetches/compiles a native binary in postinstall. Without this, `pnpm install` ends in
# ERR_PNPM_IGNORED_BUILDS and every later `pnpm test`/`pnpm build` fails on the install
# check that runs before the script itself.
allowBuilds:
  esbuild: true

# O pnpm segura pacotes publicados há pouco tempo, como defesa contra um pacote
# comprometido que acabou de subir. O rrfparser é nosso e foi publicado agora, então
# sem esta exceção o `pnpm install --frozen-lockfile` do deploy se recusa a instalar.
# A exceção é presa à versão de propósito: ao subir para a 1.0.0 esta linha sai (ou
# vira a nova versão), em vez de virar um passe livre permanente para o pacote.
minimumReleaseAgeExclude:
  - rrfparser@1.0.0-rc.1
