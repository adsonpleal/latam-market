name: Exportar da Cloudflare

# A carga única do histórico para a VM: exporta o D1 e o mercado corrente do R2, e deixa os
# arquivos em /var/lib/latam-market/import/. Quem carrega no banco é o passo manual do
# `infra/CUTOVER.md` — este workflow não mexe no serviço.
#
# Disparo manual. Rode com a coleta PARADA: o export do D1 bloqueia o banco enquanto roda, e
# uma ingestão no meio deixaria o blob do R2 apontando para um snapshot que o export não viu.
on:
  workflow_dispatch:

concurrency:
  group: latam-market-shipper
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exportar D1 e R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p export
          npx --yes wrangler@4 d1 export latam-market --remote --output export/d1.sql
          for s in FREYA NIDHOGG; do
            id=$(npx --yes wrangler@4 r2 object get "latam-market-snapshots/snap/$s/current.txt" --remote --pipe)
            echo "$s: snapshot $id"
            npx --yes wrangler@4 r2 object get "latam-market-snapshots/snap/$s/$id.json" --remote --pipe > "export/$s.json.gz"
          done
          gzip -9 export/d1.sql
          ls -lh export

      # Guardado por 7 dias: é a única cópia do que estava na Cloudflare depois que o Worker,
      # o D1 e o R2 forem apagados.
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-export
          path: export
          retention-days: 7

      - name: Enviar para a VM
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy.pem "ubuntu@$DEPLOY_HOST" 'sudo install -d -o ubuntu -g ubuntu /var/lib/latam-market/import'
          scp -i ~/.ssh/deploy.pem export/* "ubuntu@$DEPLOY_HOST:/var/lib/latam-market/import/"
