name: Deploy

# Um deploy por push na main. Um processo só na VM serve a API, o MCP, a interface e a
# coleta, então não há motivo para filtrar por caminho: qualquer mudança em src/, web/ ou
# data/ muda o que roda.
on:
  push:
    branches: [main]
  workflow_dispatch:

# O mesmo grupo do deploy do coletor: os dois reiniciam a MESMA unit, e dois restarts
# cruzados deixariam o processo subindo com metade de cada versão.
concurrency:
  group: latam-market
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Necessária para empurrar a tag `anunciado-v*` que registra o que já foi publicado
    # no Discord.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico e tags completos: o passo do anúncio compara a versão do
          # package.json com a última tag `anunciado-v*`.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm typecheck
          pnpm --filter web typecheck

      # A suíte inteira roda em processo, sobre SQLite em memória — a paridade entre API e
      # MCP inclusive. Se quebrar, nada sobe.
      - name: Testes
        run: |
          pnpm test
          pnpm --filter web test

      - name: Build
        run: |
          pnpm --filter web build
          # DEPOIS do vite build, que limpa o dist: é o catálogo que o servidor carrega.
          pnpm catalogue
          pnpm build

      - name: Conferir os artefatos
        run: |
          test -s web/dist/index.html
          ls web/dist/assets/*.js >/dev/null
          ls web/dist/generated/catalogue.*.json >/dev/null
          ls web/dist/generated/descriptions.*.json >/dev/null
          test -s dist/server.mjs
          test -s dist/crawl-thread.mjs
          test -s dist/import-cloudflare.mjs
          ls migrations/*.sql >/dev/null
          tar -czf service.tar.gz dist web/dist migrations infra
          ls -lh service.tar.gz

      - name: Configurar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Na VM: troca os arquivos e reinicia a unit. O banco não mora aqui (StateDirectory,
      # /var/lib/latam-market), então o `--delete` só leva código velho.
      - name: Enviar e reiniciar
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/deploy.pem service.tar.gz "ubuntu@$DEPLOY_HOST:~/"
          ssh -i ~/.ssh/deploy.pem "ubuntu@$DEPLOY_HOST" '
            set -e
            rm -rf ~/service-next && mkdir -p ~/service-next
            tar -xzf ~/service.tar.gz -C ~/service-next
            test -s ~/service-next/dist/server.mjs
            mv ~/service-next/web/dist ~/service-next/web-dist && rm -rf ~/service-next/web && mv ~/service-next/web-dist ~/service-next/web

            sudo install -d -o ubuntu -g ubuntu /opt/latam-market
            sudo rsync -a --delete ~/service-next/ /opt/latam-market/
            sudo chown -R ubuntu:ubuntu /opt/latam-market
            chmod +x /opt/latam-market/infra/smoke.sh /opt/latam-market/infra/vm-prep.sh
            rm -rf ~/service-next ~/service.tar.gz

            for f in latam-market.service latam-market-backup.service latam-market-backup.timer; do
              sudo cp "/opt/latam-market/infra/$f" /etc/systemd/system/
            done
            sudo systemctl daemon-reload
            sudo systemctl enable --quiet latam-market latam-market-backup.timer
            sudo systemctl start latam-market-backup.timer
            sudo systemctl restart latam-market
          '

      # Contra o processo local, pelo Host público: o domínio pode ainda estar apontando para
      # outro lugar (antes da virada do túnel), e o que este deploy trocou foi a VM.
      - name: Verificar
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy.pem "ubuntu@$DEPLOY_HOST" '
            for _ in $(seq 60); do
              curl -sf -H "Host: mercado.latam-tools.com.br" http://127.0.0.1:8788/healthz >/dev/null && break
              sleep 1
            done
            HOST_HEADER=mercado.latam-tools.com.br bash /opt/latam-market/infra/smoke.sh http://127.0.0.1:8788
          '

      # A referência é a última versão ANUNCIADA, não a do commit anterior.
      #
      # Comparar com o commit anterior faz um deploy que falhe entre o push e este
      # passo engolir o anúncio para sempre: a `main` já avançou, então as execuções
      # seguintes veem "versão igual" e pulam. Aconteceu com a 0.2.1. A tag só é criada
      # depois de o post sair, então enquanto ela não existir o anúncio continua
      # pendente e a próxima execução verde o publica.
      - name: Detectar versão ainda não anunciada
        id: ver
        run: |
          NEW=$(node -p "require('./package.json').version")
          git fetch --tags --quiet || true
          OLD=$(git tag -l 'anunciado-v*' --sort=-creatordate | head -1 | sed 's/^anunciado-v//')
          echo "versão atual: $NEW / última anunciada: ${OLD:-<nenhuma>}"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" != "$OLD" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publicar novidades no Discord
        id: discord
        if: steps.ver.outputs.changed == 'true'
        # O deploy já deu certo neste ponto; falhar o job porque o Discord recusou
        # seria trocar um aviso perdido por um vermelho enganoso. E como a tag só sai
        # se este passo passar, um erro aqui apenas adia o anúncio.
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
        run: node tools/post-novidades.mjs

      - name: Marcar a versão como anunciada
        if: steps.discord.outcome == 'success'
        run: |
          git tag "anunciado-v${{ steps.ver.outputs.version }}"
          git push origin "anunciado-v${{ steps.ver.outputs.version }}"
