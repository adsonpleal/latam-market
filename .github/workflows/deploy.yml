name: Deploy

# Um deploy por push na main. O site é estático — a interface, o catálogo gerado de
# data/latam-items.json e nada mais —, então não há motivo para filtrar por caminho: qualquer
# mudança em web/, data/ ou tools/ muda o que é publicado ou o que é testado.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez: o Cloudflare Pages aceita dois uploads cruzados, e o que terminar por
# último vira a produção — que pode ser o commit mais velho.
concurrency:
  group: latam-market
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Necessária para empurrar a tag `anunciado-v*` que registra o que já foi publicado
    # no Discord.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico e tags completos: o passo do anúncio compara a versão do
          # package.json com a última tag `anunciado-v*`.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter web typecheck

      # Na raiz só sobraram os testes de tools/ (o sync do catálogo); o resto mora em web/. Tudo em processo, sem rede. Se quebrar, nada sobe.
      - name: Testes
        run: |
          pnpm test
          pnpm --filter web test

      # O `prebuild` do web gera o catálogo (itens, descrições, intransferíveis) de
      # data/latam-items.json em web/public/generated/, que o Vite copia para o dist.
      - name: Build
        run: pnpm --filter web build

      # O `_headers` é o que dá `immutable` aos assets com hash e `must-revalidate` ao HTML;
      # sem ele o Pages publica com o cache padrão e um deploy pode deixar tela branca em quem
      # tinha o índice velho. Os três JSON gerados são o catálogo inteiro: sem eles a busca e
      # o replay abrem vazios, sem erro nenhum no build.
      - name: Conferir os artefatos
        run: |
          test -s web/dist/index.html
          test -s web/dist/_headers
          ls web/dist/assets/*.js >/dev/null
          ls web/dist/generated/items.*.json \
             web/dist/generated/descriptions.*.json \
             web/dist/generated/untradable.*.json
          du -sh web/dist

      # Upload direto (direct upload) para o projeto `latam-market` do Cloudflare Pages. O
      # `--branch=main` é o que faz o deploy ser de PRODUÇÃO: qualquer outro nome de branch
      # vira preview em <hash>.latam-market.pages.dev e não chega ao domínio.
      #
      # O token (secret CLOUDFLARE_API_TOKEN) precisa só de uma permissão:
      #   Account › Cloudflare Pages › Edit
      # restrito à conta que tem o projeto. Não precisa de nada de zona nem de DNS — o
      # domínio próprio é configurado uma vez no painel, não por este workflow. O
      # CLOUDFLARE_ACCOUNT_ID é o id da conta (painel → qualquer zona → barra lateral, ou a
      # URL do dashboard). Passo a passo em infra/DESLIGAMENTO.md.
      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=latam-market --branch=main

      # A referência é a última versão ANUNCIADA, não a do commit anterior.
      #
      # Comparar com o commit anterior faz um deploy que falhe entre o push e este
      # passo engolir o anúncio para sempre: a `main` já avançou, então as execuções
      # seguintes veem "versão igual" e pulam. Aconteceu com a 0.2.1. A tag só é criada
      # depois de o post sair, então enquanto ela não existir o anúncio continua
      # pendente e a próxima execução verde o publica.
      - name: Detectar versão ainda não anunciada
        id: ver
        run: |
          NEW=$(node -p "require('./package.json').version")
          git fetch --tags --quiet || true
          OLD=$(git tag -l 'anunciado-v*' --sort=-creatordate | head -1 | sed 's/^anunciado-v//')
          echo "versão atual: $NEW / última anunciada: ${OLD:-<nenhuma>}"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" != "$OLD" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publicar novidades no Discord
        id: discord
        if: steps.ver.outputs.changed == 'true'
        # O deploy já deu certo neste ponto; falhar o job porque o Discord recusou
        # seria trocar um aviso perdido por um vermelho enganoso. E como a tag só sai
        # se este passo passar, um erro aqui apenas adia o anúncio.
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
        run: node tools/post-novidades.mjs

      - name: Marcar a versão como anunciada
        if: steps.discord.outcome == 'success'
        run: |
          git tag "anunciado-v${{ steps.ver.outputs.version }}"
          git push origin "anunciado-v${{ steps.ver.outputs.version }}"
