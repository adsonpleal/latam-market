name: Deploy

# Um deploy por push na main. Um Worker só serve a API, o MCP e a interface, então não há
# motivo para filtrar por caminho: qualquer mudança em src/, web/ ou data/ muda o que roda.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: latam-market-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Necessária para empurrar a tag `anunciado-v*` que registra o que já foi publicado
    # no Discord.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico e tags completos: o passo do anúncio compara a versão do
          # package.json com a última tag `anunciado-v*`.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm typecheck
          pnpm --filter web typecheck

      # Duas suítes: `node` para a lógica pura, `workers` para o que só tem sentido dentro
      # do runtime de produção — a paridade entre API e MCP, a ingestão e o cache de borda.
      # Se qualquer uma quebrar, nada sobe.
      - name: Testes
        run: |
          pnpm test
          pnpm --filter web test

      - name: Build da interface
        run: |
          pnpm --filter web build
          # DEPOIS do vite build, que limpa o dist: é o catálogo que o Worker hidrata.
          pnpm catalogue

      - name: Conferir os artefatos
        run: |
          test -s web/dist/index.html
          ls web/dist/assets/*.js >/dev/null
          ls web/dist/generated/catalogue.*.json >/dev/null
          ls web/dist/generated/descriptions.*.json >/dev/null
          # Os pré-comprimidos sumiram junto com o Caddy: a Cloudflare comprime na entrega,
          # e mantê-los seria servir arquivo morto com o Content-Type errado.
          ! ls web/dist/**/*.br >/dev/null 2>&1

      # ANTES do deploy, e é a ordem que importa: entre este passo e o próximo o Worker
      # antigo ainda está no ar, então uma migração tem que ser compatível com ele.
      - name: Migrações do D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply latam-market --remote

      - name: Publicar o Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # As mesmas checagens de contrato de sempre — healthz, catálogo carregado, MCP, REST
      # e a raiz servindo HTML —, agora contra o Worker. `BASE` é variável porque até o
      # cutover o Worker vive só em *.workers.dev; depois passa a ser o domínio.
      - name: Verificar
        env:
          BASE: ${{ vars.DEPLOY_BASE_URL }}
        run: bash infra/smoke.sh "$BASE"

      # A referência é a última versão ANUNCIADA, não a do commit anterior.
      #
      # Comparar com o commit anterior faz um deploy que falhe entre o push e este
      # passo engolir o anúncio para sempre: a `main` já avançou, então as execuções
      # seguintes veem "versão igual" e pulam. Aconteceu com a 0.2.1. A tag só é criada
      # depois de o post sair, então enquanto ela não existir o anúncio continua
      # pendente e a próxima execução verde o publica.
      - name: Detectar versão ainda não anunciada
        id: ver
        run: |
          NEW=$(node -p "require('./package.json').version")
          git fetch --tags --quiet || true
          OLD=$(git tag -l 'anunciado-v*' --sort=-creatordate | head -1 | sed 's/^anunciado-v//')
          echo "versão atual: $NEW / última anunciada: ${OLD:-<nenhuma>}"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" != "$OLD" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publicar novidades no Discord
        id: discord
        if: steps.ver.outputs.changed == 'true'
        # O deploy já deu certo neste ponto; falhar o job porque o Discord recusou
        # seria trocar um aviso perdido por um vermelho enganoso. E como a tag só sai
        # se este passo passar, um erro aqui apenas adia o anúncio.
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
        run: node tools/post-novidades.mjs

      - name: Marcar a versão como anunciada
        if: steps.discord.outcome == 'success'
        run: |
          git tag "anunciado-v${{ steps.ver.outputs.version }}"
          git push origin "anunciado-v${{ steps.ver.outputs.version }}"
