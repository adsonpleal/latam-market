name: Deploy web

# Só o que muda a interface. `data/latam-items.json` entra na lista porque o build tira
# dele as descrições e a lista de intransferíveis: uma atualização do catálogo precisa
# republicar o front, senão a interface e o serviço passam a falar de itens diferentes.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/latam-items.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

concurrency:
  group: latam-market-web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # Mesma versão do serviço. O script do catálogo usa `node:zlib` para gerar o
          # brotli e o zstd estáticos.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter web typecheck

      # Cobre o que erra em silêncio: a regra de "intransferível" (que decide o filtro
      # ligado por padrão), o parser de cor `^RRGGBB` e o escape do CSV.
      - name: Testes
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build

      - name: Empacotar
        run: |
          # Sanidade antes de mandar. Um tar sem o index deixa o site em 404; um sem as
          # descrições deixa todo hover vazio. Os dois passam despercebidos no CI se
          # ninguém olhar, e só aparecem para quem abrir a página.
          test -s web/dist/index.html
          ls web/dist/assets/*.js >/dev/null
          ls web/dist/generated/descriptions.*.json >/dev/null
          ls web/dist/generated/descriptions.*.json.br >/dev/null
          ls web/dist/generated/untradable.*.json >/dev/null
          tar -czf latam-market-web.tar.gz -C web/dist .
          ls -lh latam-market-web.tar.gz

      - name: Configurar SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Enviar
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp -i ~/.ssh/deploy.pem latam-market-web.tar.gz "ubuntu@$EC2_HOST:~/"
          ssh -i ~/.ssh/deploy.pem "ubuntu@$EC2_HOST" '
            set -e
            # Extrai num diretório de espera primeiro: um envio truncado nunca pode
            # deixar /opt/latam-market-web com meia interface.
            rm -rf ~/latam-market-web-next && mkdir -p ~/latam-market-web-next
            tar -xzf ~/latam-market-web.tar.gz -C ~/latam-market-web-next
            test -s ~/latam-market-web-next/index.html

            # Idempotente: cria na primeira execução e cala nas seguintes.
            sudo install -d -o ubuntu -g ubuntu /opt/latam-market-web
            # --delete limpa os assets com hash antigo. Nada mais mora aqui: o banco
            # está em /var/lib e o serviço em /opt/latam-market.
            sudo rsync -a --delete ~/latam-market-web-next/ /opt/latam-market-web/
            sudo chown -R ubuntu:ubuntu /opt/latam-market-web
            rm -rf ~/latam-market-web-next ~/latam-market-web.tar.gz

            # Sem reload do Caddy: arquivo estático não é configuração, e este mesmo
            # Caddy serve outros três sites. Só uma mudança no .caddy exige reload.
          '

      - name: Verificar
        run: |
          BASE=https://mercado.latam-tools.com.br

          # A interface responde na raiz...
          curl -sf "$BASE/" | grep -q 'id="root"'
          # ...e uma rota desconhecida cai no index (try_files), em vez de 404.
          curl -sf "$BASE/pechinchas" | grep -q 'id="root"'

          # O asset com hash existe mesmo. Sem esta checagem, um index servido para tudo
          # faria os dois testes acima passarem com a interface quebrada.
          ASSET=$(curl -sf "$BASE/" | grep -o '/assets/[^"]*\.js' | head -1)
          test -n "$ASSET"
          curl -sfI "$BASE$ASSET" | grep -qi 'content-type: .*javascript'

          # O catálogo de descrições, que é o que faz o hover funcionar. A URL vai
          # embutida no bundle (src/generated/catalogue.ts), então achá-la ali e buscá-la
          # confere os dois lados de uma vez: o hash bateu e o arquivo subiu.
          CAT=$(curl -sf "$BASE$ASSET" | grep -o '/generated/descriptions\.[a-f0-9]*\.json' | head -1)
          test -n "$CAT"
          curl -sfI "$BASE$CAT" | grep -qi 'content-type: .*json'

          # O que mais importa nesta mudança: o file_server não pode ter engolido a API.
          # O mesmo script roda à mão depois de todo reload do Caddy — que é a única
          # coisa capaz de quebrar a ordem dos `handle`.
          bash infra/smoke.sh "$BASE"
